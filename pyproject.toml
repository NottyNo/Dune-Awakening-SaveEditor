[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dune-awakening-save-editor"
version = "1.0.0a2"
description = "Offline inventory and character editor for Dune: Awakening solo saves"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
dune-save-editor = "dune_save_editor.app:main"

[tool.setuptools.package-data]
dune_save_editor = ["assets/*.ico", "assets/*.png", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
